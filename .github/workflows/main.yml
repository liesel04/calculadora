name: CI/CD - Calculadora HTML JavaScript - AWS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm install

      - name: Validar HTML
        run: npm run lint:html

      - name: Validar JavaScript
        run: npm run check:js

      - name: Ejecutar pruebas
        run: npm test

      - name: Preparar build
        run: npm run build

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sitio-web
          path: dist/

  deploy:
    name: Desplegar en AWS S3
    needs: build-test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm install

      - name: Generar build
        run: npm run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Desplegar sitio en S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Confirmar despliegue
        run: |
          echo "======================================"
          echo "Despliegue realizado correctamente"
          echo "Bucket: ${{ secrets.AWS_S3_BUCKET }}"
          echo "======================================"
